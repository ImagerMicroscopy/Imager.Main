name: Publish Imager
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build:


    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      PROJECT_PATH:   ImagerAvalonia.Desktop
      TEST_PROJECT_PATH: ImagerAvalonia.Tests
      GUI_PATH: gui
      CORE_PATH: core
      CAMERA_PATH: camera
      PLUGIN_PATH: plugins
      TIFFLIB_PATH: tifflib
      SMART_PATH: smart
      PYTHON_VER: "3.13.1"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: ImagerMicroscopy/Imager.GUI
        ssh-key: ${{ secrets.GUI_CLONE }}
        path: ${{ env.GUI_PATH }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish GUI
      run:  |
        New-Item -ItemType Directory -Force -Path "..\Release"
        New-Item -ItemType Directory -Force -Path "..\Release\hardwareplugins"
        $guiPath = Join-Path $env:GUI_PATH $env:PROJECT_PATH
        dotnet publish $guipath -r win-x64 -c Release --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:IsTestProject=false -p:EnableCodeCoverage=false -o Release

    - name: Install Python Dependencies
      run: pip install meson ninja

    - name: Prepare MSVC
      uses: bus1/cabuild/action/msdevshell@v1
      with:
         architecture: x64

    - name: Clone Imager Plugins
      uses: actions/checkout@v4
      with:
         lfs: true
         repository: ImagerMicroscopy/Imager.Plugins
         path: ${{ env.PLUGIN_PATH }}

    - name: Build plugins
      working-directory: ${{ env.PLUGIN_PATH }}
      shell: powershell
      run: |
        meson subprojects download
        meson setup builddir --buildtype=release
        meson compile -C builddir
        $releasePlugins = Join-Path $env:GITHUB_WORKSPACE "Release\Plugins"
        New-Item -ItemType Directory -Force -Path $releasePlugins
        Copy-Item "builddir/DummyCamera/DummyCamera.imagerplugin" -Destination $releasePlugins
        Copy-Item "builddir/DummyEquipment/DummyEquipment.imagerplugin" -Destination $releasePlugins
        $dest = Join-Path $env:GITHUB_WORKSPACE "Release\hardwareplugins"
        New-Item -ItemType Directory -Force -Path $dest
        Copy-Item "builddir\*" -Destination $dest -Recurse

    - name: Clone TiffLib
      uses: actions/checkout@v4
      with:
         repository: ImagerMicroscopy/Imager.TiffLib
         ssh-key: ${{ secrets.TIFFLIB_CLONE }}
         path: ${{ env.TIFFLIB_PATH }}


    - name: Run TiffLib Build
      shell: pwsh
      working-directory: ${{ env.TIFFLIB_PATH }}
      run: |
        meson setup builddir
        if ($LASTEXITCODE -ne 0) { throw "Meson setup failed" }

        meson compile -C builddir
        if ($LASTEXITCODE -ne 0) { throw "TiffLib compilation failed" }

        Copy-Item "builddir\MeasurementImageStorage.dll" -Destination "..\Release"
        Copy-Item "builddir\MeasurementImageStorage.lib" -Destination "..\Release"

    # Runs every GUI test. IMAGER_MIS_LIBRARY switches on the integration tests that
    # write and read real storage files through the TiffLib DLL built in the step above
    # (without it those tests are skipped). A failing test fails the job, so nothing
    # below (zip, release) runs on a broken build.
    - name: Run tests
      shell: pwsh
      env:
        IMAGER_MIS_LIBRARY: ${{ github.workspace }}\${{ env.TIFFLIB_PATH }}\builddir\MeasurementImageStorage.dll
      run: |
        if (-not (Test-Path $env:IMAGER_MIS_LIBRARY)) {
          throw "TiffLib DLL not found at $env:IMAGER_MIS_LIBRARY - storage tests would be skipped."
        }
        $testProject = Join-Path $env:GUI_PATH $env:TEST_PROJECT_PATH
        dotnet test $testProject -c Release `
          --logger "trx;LogFileName=results.trx" `
          --logger "console;verbosity=normal" `
          --collect:"XPlat Code Coverage" `
          --results-directory TestResults

    - name: Coverage summary
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: TestResults/**/coverage.cobertura.xml
        targetdir: TestResults/coverage-report
        reporttypes: MarkdownSummaryGithub;HtmlInline

    - name: Publish coverage to job summary
      if: always()
      shell: pwsh
      run: |
        $summary = "TestResults/coverage-report/SummaryGithub.md"
        if (Test-Path $summary) { Get-Content $summary >> $env:GITHUB_STEP_SUMMARY }

    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults


    - name: Clone SCCamera
      uses: actions/checkout@v4
      with:
         lfs: true
         repository: ImagerMicroscopy/Imager.Cameras
         ssh-key: ${{ secrets.CAMERA_CLONE }}
         path: ${{ env.CAMERA_PATH }}

    - name: Run Camera Build
      working-directory: ${{ env.CAMERA_PATH }}
      run: |
         meson setup builddir
         meson compile -C builddir
         New-Item -ItemType Directory -Force -Path ..\Release\Plugins
         Copy-Item "builddir\SCCamera.imagerplugin" -Destination "..\Release\Plugins"

    - name: Clone Core
      uses: actions/checkout@v4
      with:
         repository: ImagerMicroscopy/Imager.Core
         ssh-key: ${{ secrets.CORE_CLONE }}
         path: ${{ env.CORE_PATH }}


    - name: Build Core
      uses: haskell-actions/setup@v2
      with:
          ghc-version: '8.8.4' # Exact version of ghc to use
          enable-stack: true
          stack-version: 'latest'

    - run: |
             cd $env:CORE_PATH
             stack build .
             $installRoot = stack path --local-install-root
             New-Item -ItemType Directory -Force -Path build
             New-Item -ItemType Directory -Force -Path build\Plugins
             Copy-Item "$installRoot\bin\*" build -Recurse
             Copy-Item "build\*" -Destination "..\Release" -Recurse -Force
             Copy-Item "equipment.txt" -Destination "..\Release"








    - name: Clone Smart Program Server
      uses: actions/checkout@v4
      with:
         repository: ImagerMicroscopy/Imager.Smart
         ssh-key: ${{ secrets.SMART_CLONE }}
         path: ${{ env.SMART_PATH }}

    - name: Copy Smart server files
      run: |
        New-Item -ItemType Directory -Force -Path "Release\SmartProgramPython"
        Copy-Item "$env:SMART_PATH\*" -Destination "Release\SmartProgramPython" -Recurse -Force

    - name: Download and Extract Embeddable Python
      run: |
        $url = "https://www.python.org/ftp/python/${{ env.PYTHON_VER }}/python-${{ env.PYTHON_VER }}-embed-amd64.zip"
        Invoke-WebRequest -Uri $url -OutFile python.zip
        Expand-Archive -Path python.zip -DestinationPath ./temp_python

    - name: Enable Site-Packages
      run: |
        $pthFile = Get-ChildItem -Path ./temp_python -Filter "*._pth" | Select-Object -First 1
        if ($pthFile) {
            $content = Get-Content $pthFile.FullName
            $content = $content -replace "#import site", "import site"
            Set-Content -Path $pthFile.FullName -Value $content
        }

    - name: Install Pip and Requirements
      shell: powershell
      run: |
        $reqPath = Join-Path $env:SMART_PATH "requirements.txt"
        Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py

        ./temp_python/python.exe get-pip.py --no-warn-script-location
        ./temp_python/python.exe -m pip install setuptools wheel --no-warn-script-location
        if (Test-Path $reqPath) {
            ./temp_python/python.exe -m pip install -r $reqPath --no-warn-script-location --only-binary=:all:
        }
        Remove-Item get-pip.py

    - name: Copy to Release Folder
      run: |
        New-Item -ItemType Directory -Force -Path "Release\python"
        New-Item -ItemType Directory -Force -Path "Release\PluginConfigurations"
        Copy-Item -Path ".\temp_python\*" -Destination "Release\python" -Recurse -Force

    - name: Zip release
      run: 7z a Imager-Release-winx64.zip .\Release\*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Imager-Release-winx64
        path: Imager-Release-winx64.zip

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Imager-Release-winx64
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Imager ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          files: ./downloaded-artifacts/Imager-Release-winx64.zip
          draft: false
          prerelease: false
          generate_release_notes: false
